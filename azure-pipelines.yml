trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: platforminfra
      type: github
      name: PAIFteam/Platform-INFRA
      endpoint: PAIFteam
    - repository: usersapi
      type: github
      name: PAIFteam/Users-API
      endpoint: PAIFteam
    - repository: notificationsapi
      type: github
      name: PAIFteam/Notifications-API
      endpoint: PAIFteam
    - repository: catalogapi
      type: github
      name: PAIFteam/Catalog-API
      endpoint: PAIFteam
    - repository: paymentsapi
      type: github
      name: PAIFteam/Payments-API
      endpoint: PAIFteam

variables:
  azureSubscription: 'k8spaifgames'    # Service connection do Azure DevOps
  acrServiceConnection: 'dockerpaifgames'   # Service connection ACR (usado pelo Docker task)
  acrName: 'acrpaifgames'                                 # nome do ACR (sem .azurecr.io)
  acrLoginServer: 'acrpaifgames.azurecr.io'               # ex: youracr.azurecr.io
  resourceGroup: 'rg-paifgames'
  location: 'eastus'
  vmResourceGroup: 'vmpaifgames'        # <--- resource group onde o VM/infra já existe
  aksClusterName: 'k8spaifgames'
  kubernetesNamespace: 'paifgames-ns'
  dotnetVersion: '8.0.x'
  imageTag: '$(Build.BuildId)'

stages:
  - stage: BuildAndPush
    displayName: 'Build solutions e push de imagens para ACR'
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: usersapi
            path: 's/users-api'
          - checkout: notificationsapi
            path: 's/notifications-api'
          - checkout: catalogapi
            path: 's/catalog-api'
          - checkout: paymentsapi
            path: 's/payments-api'
          - checkout: platforminfra
            path: 's/platform-infra'
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK'
            inputs:
              packageType: 'sdk'
              version: $(dotnetVersion)
          - task: Docker@2
            displayName: 'Login into Registry $(acrServiceConnection)' 
            inputs:
              containerRegistry: $(acrServiceConnection) 
              command: 'login'
          
          # Ajuste os caminhos dos Dockerfiles conforme a estrutura real de cada repositório.
          - task: Docker@2
            displayName: 'Build & Push Users API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'usersapi'
              command: 'buildAndPush'
              dockerfile: 'users-api/src/Dockerfile'
              buildContext: 'users-api'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Build & Push Notifications API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'notifications-api'
              command: 'buildAndPush'
              dockerfile: 'notifications-api/src/Dockerfile'
              buildContext: 'notifications-api'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Build & Push Catalog API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'catalog-api'
              command: 'buildAndPush'
              dockerfile: 'catalog-api/src/Dockerfile'
              buildContext: 'catalog-api'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Build & Push Payments API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'payments-api'
              command: 'buildAndPush'
              dockerfile: 'payments-api/src/Dockerfile'
              buildContext: 'payments-api'
              tags: |
                $(imageTag)
                latest

  - stage: CreateAKS
    displayName: 'Criar AKS (k8spaifgames)'
    dependsOn: BuildAndPush
    jobs:
      - job: CreateCluster
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Criar/Configurar AKS no resource group rg-paifgames'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                echo "Resource group: $(resourceGroup)"
                if ! az aks show -g $(resourceGroup) -n $(aksClusterName) >/dev/null 2>&1; then
                  echo "Criando AKS $(aksClusterName) em $(resourceGroup)"
                  az aks create -g $(resourceGroup) -n $(aksClusterName) \
                    --node-count 1 \
                    --enable-managed-identity \
                    --generate-ssh-keys \
                    --attach-acr $(acrName)
                else
                  echo "AKS $(aksClusterName) já existe em $(resourceGroup)"
                fi
                az aks get-credentials -g $(resourceGroup) -n $(aksClusterName) --overwrite-existing
                kubectl get nodes -o wide

  - stage: Deploy
    displayName: 'Deploy imagens e infra no AKS'
    dependsOn: CreateAKS
    jobs:
      - job: DeployToAKS
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: usersapi
            path: 's/users-api'
          - checkout: notificationsapi
            path: 's/notifications-api'
          - checkout: catalogapi
            path: 's/catalog-api'
          - checkout: paymentsapi
            path: 's/payments-api'
          - checkout: platforminfra
            path: 's/platform-infra'

          - task: AzureCLI@2
            displayName: 'Configurar kubectl e login no ACR'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                az aks get-credentials -g $(resourceGroup) -n $(aksClusterName) --overwrite-existing
                az acr login -n $(acrName) || true
                kubectl create namespace $(kubernetesNamespace) || true
                kubectl config set-context --current --namespace=$(kubernetesNamespace)

          - task: AzureCLI@2
            displayName: 'Converter docker-compose (Platform-INFRA) -> manifests k8s e aplicar'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                COMPOSE="$(Build.SourcesDirectory)/s/platform-infra/docker-compose.yml"
                if [ ! -f "$COMPOSE" ]; then
                  echo "docker-compose.yml não encontrado: $COMPOSE"
                  exit 1
                fi
                if ! command -v kompose >/dev/null 2>&1; then
                  curl -L https://github.com/kubernetes/kompose/releases/latest/download/kompose-linux-amd64 -o kompose
                  chmod +x kompose
                  sudo mv kompose /usr/local/bin/kompose
                fi
                ACR="$(acrLoginServer)"
                TAG="$(Build.BuildId)"
                tmpfile=$(mktemp)
                awk -v acr="$ACR" -v tag="$TAG" '
                  /^([[:space:]]*)image:/ {
                    indent=substr($0,1,match($0,/image:/)-1)
                    sub(/^[[:space:]]*image:[[:space:]]*/,"")
                    img=$0
                    gsub(/[ \t\r\n]+$/,"")
                    split(img,a,":")
                    name=a[1]
                    if (index(name,"/")>0) { split(name,parts,"/"); name=parts[length(parts)]; }
                    print indent "image: " acr "/" name ":" tag
                    next
                  }
                  { print $0 }
                ' "$COMPOSE" > "$tmpfile" && mv "$tmpfile" "$COMPOSE"
                mkdir -p k8s-manifests
                kompose -f "$COMPOSE" convert -o k8s-manifests
                kubectl apply -n $(kubernetesNamespace) -f k8s-manifests
                # aplica manifests k8s específicos de cada repo, se existirem
                for repo in users-api notifications-api catalog-api payments-api; do
                  if [ -d "$(Build.SourcesDirectory)/s/$repo/k8s" ]; then
                    kubectl apply -n $(kubernetesNamespace) -f "$(Build.SourcesDirectory)/s/$repo/k8s" || true
                  fi
                done
                kubectl rollout status -n $(kubernetesNamespace) deployment --timeout=10m || true

          - task: AzureCLI@2
            displayName: 'Verificações finais'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                kubectl get pods,svc -n $(kubernetesNamespace) -o wide

  - stage: CleanupOnFailure
    displayName: 'Cleanup (apenas em falha)'
    condition: failed()
    jobs:
      - job: Cleanup
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Pipeline falhou. Para remover o cluster execute:"
              echo "az aks delete --resource-group $(resourceGroup) --name $(aksClusterName) --yes --no-wait"
            displayName: 'Instruções de cleanup'