trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: platforminfra
      type: github
      name: PAIFteam/Platform-INFRA
      endpoint: PAIFteam
    - repository: usersapi
      type: github
      name: PAIFteam/Users-API
      endpoint: PAIFteam
    - repository: notificationsapi
      type: github
      name: PAIFteam/Notifications-API
      endpoint: PAIFteam
    - repository: catalogapi
      type: github
      name: PAIFteam/Catalog-API
      endpoint: PAIFteam
    - repository: paymentsapi
      type: github
      name: PAIFteam/Payments-API
      endpoint: PAIFteam
    - repository: salescartapi
      type: github
      name: PAIFteam/SalesCart-API
      endpoint: PAIFteam

variables:
  azureSubscription: 'k8spaifgames'    # Service connection do Azure DevOps
  acrServiceConnection: 'dockerpaifgames'   # Service connection ACR (usado pelo Docker task)
  acrName: 'acrpaifgamesdev'                                 # nome do ACR (sem .azurecr.io)
  acrLoginServer: 'acrpaifgamesdev.azurecr.io'               # ex: youracr.azurecr.io
  resourceGroup: 'rg-paifgames-dev'
  location: 'eastus'
  vmResourceGroup: 'rg-paifgames-dev'        # <--- resource group onde o VM/infra já existe
  aksClusterName: 'akspaifgamesdev'
  kubernetesNamespace: 'paifgames-ns'
  dotnetVersion: '8.0.x'
  imageTag: '$(Build.BuildId)'

stages:
  - stage: Tests
    displayName: 'CI - Executar testes obrigatórios'
    jobs:
      - job: RunTests
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: usersapi
            path: 's/users-api'
          - checkout: notificationsapi
            path: 's/notifications-api'
          - checkout: catalogapi
            path: 's/catalog-api'
          - checkout: paymentsapi
            path: 's/payments-api'
          - checkout: salescartapi
            path: 's/salescart-api'
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK'
            inputs:
              packageType: 'sdk'
              version: $(dotnetVersion)
          - script: dotnet test "$(Pipeline.Workspace)/s/users-api/tests/Users.UnitTests/Users.UnitTests.csproj" --configuration Release --logger "trx;LogFileName=users-tests.trx"
            displayName: 'Executar Users.UnitTests'
          - script: dotnet test "$(Pipeline.Workspace)/s/catalog-api/tests/Catalog.UnitTests/Catalog.UnitTests.csproj" --configuration Release --logger "trx;LogFileName=catalog-tests.trx"
            displayName: 'Executar Catalog.UnitTests'
          - script: dotnet test "$(Pipeline.Workspace)/s/payments-api/tests/Payments.UnitTests/Payments.UnitTests.csproj" --configuration Release --logger "trx;LogFileName=payments-tests.trx"
            displayName: 'Executar Payments.UnitTests'
          - script: dotnet test "$(Pipeline.Workspace)/s/notifications-api/tests/Notifications.UnitTests/Notifications.UnitTests.csproj" --configuration Release --logger "trx;LogFileName=notifications-tests.trx"
            displayName: 'Executar Notifications.UnitTests'
          - script: dotnet test "$(Pipeline.Workspace)/s/salescart-api/tests/SalesCart.UnitTests/SalesCart.UnitTests.csproj" --configuration Release --logger "trx;LogFileName=salescart-tests.trx"
            displayName: 'Executar SalesCart.UnitTests'
          - task: PublishTestResults@2
            displayName: 'Publicar resultados dos testes'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              searchFolder: '$(Agent.TempDirectory)'
              failTaskOnFailedTests: true

  - stage: BuildAndPush
    displayName: 'CI - Build solutions e push de imagens para ACR'
    dependsOn: Tests
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: usersapi
            path: 's/users-api'
          - checkout: notificationsapi
            path: 's/notifications-api'
          - checkout: catalogapi
            path: 's/catalog-api'
          - checkout: paymentsapi
            path: 's/payments-api'
          - checkout: salescartapi
            path: 's/salescart-api'
          - checkout: platforminfra
            path: 's/platform-infra'
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK'
            inputs:
              packageType: 'sdk'
              version: $(dotnetVersion)
          - task: Docker@2
            displayName: 'Login into Registry $(acrServiceConnection)' 
            inputs:
              containerRegistry: $(acrServiceConnection) 
              command: 'login'
          
          # Ajuste os caminhos dos Dockerfiles conforme a estrutura real de cada repositório.
          - task: Docker@2
            displayName: 'Build & Push Users API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'users-api'
              command: 'buildAndPush'
              dockerfile: 'users-api/src/Dockerfile'
              buildContext: 'users-api'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Build & Push Notifications API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'notifications-api'
              command: 'buildAndPush'
              dockerfile: 'notifications-api/src/Dockerfile'
              buildContext: 'notifications-api'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Build & Push Catalog API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'catalog-api'
              command: 'buildAndPush'
              dockerfile: 'catalog-api/src/Dockerfile'
              buildContext: 'catalog-api'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Build & Push Payments API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'payments-api'
              command: 'buildAndPush'
              dockerfile: 'payments-api/src/Dockerfile'
              buildContext: 'payments-api'
              tags: |
                $(imageTag)
                latest

  - stage: CreateAKS
    displayName: 'Provision - Criar AKS (k8spaifgames) em vmpaifgames (Central US - Zona 1)'
    dependsOn: BuildAndPush
    jobs:
      - job: Create
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Criar/Configurar AKS no resource group vmpaifgames'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e 
                az aks show -n $(aksClusterName) -g $(resourceGroup) >/dev/null 2>&1 ||
                az aks create -g $(resourceGroup) -n $(aksClusterName) --node-count 1 --node-vm-size Standard_D2s_v3 --generate-ssh-keys --enable-managed-identity --attach-acr $(acrName) --location centralus
                az aks get-credentials -g $(resourceGroup) -n $(aksClusterName) --overwrite-existing
  - stage: Deploy
    displayName: 'CD - Deploy docker-compose (Platform-INFRA) + APIs + infra no AKS'
    dependsOn: CreateAKS
    jobs:
      - job: DeployToAKS
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: platforminfra
            path: 's/platform-infra'

          - task: AzureCLI@2
            displayName: 'Configurar kubectl e login no ACR'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                RG="$(vmResourceGroup)"
                CLUSTER="$(aksClusterName)"
                ACR_NAME="$(acrName)"
                NAMESPACE="$(kubernetesNamespace)"

                az aks get-credentials -g "$RG" -n "$CLUSTER" --overwrite-existing

                # login no ACR para operações locais (AKS com --attach-acr já tem permissão)
                az acr login -n "$ACR_NAME" || true

                kubectl create namespace "$NAMESPACE" || true
                kubectl config set-context --current --namespace="$NAMESPACE"

          - task: AzureCLI@2
            displayName: 'Conectar no AKS'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                RG="rg-paifgames-dev"
                CLUSTER="$(aksClusterName)"

                echo "Login OK?"
                az account show

                echo "Getting credentials..."
                az aks get-credentials -g "$RG" -n "$CLUSTER" --overwrite-existing

                echo "Validando conexão..."
                kubectl get nodes
          - task: AzureCLI@2
            displayName: 'Aplicar PVC do SQL Server'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                echo "Aplicando PVC sqlserver-data..."

                kubectl apply -f "$(Build.SourcesDirectory)/k8s/infra/03-sqlserver-pvc.yaml"
                kubectl apply -f "$(Build.SourcesDirectory)/k8s/infra/04-sqlserver-deploy-svc.yaml"

                kubectl get pvc -n $(kubernetesNamespace)
                kubectl get deployment sqlserver -n $(kubernetesNamespace)
          - task: AzureCLI@2
            displayName: 'Converter docker-compose (Platform-INFRA) -> manifests k8s e aplicar'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                COMPOSE="$(Build.SourcesDirectory)/docker-compose.yml"

                if [ ! -f "$COMPOSE" ]; then
                  echo "docker-compose.yml não encontrado: $COMPOSE"
                  exit 1
                fi

                if ! command -v kompose >/dev/null 2>&1; then
                  curl -L https://github.com/kubernetes/kompose/releases/latest/download/kompose-linux-amd64 -o kompose
                  chmod +x kompose
                  sudo mv kompose /usr/local/bin/kompose
                fi

                ACR="$(acrLoginServer)"
                TAG="$(imageTag)"
                export IMAGE_TAG="$TAG"
                tmpfile=$(mktemp)

                awk -v acr="$ACR" -v tag="$TAG" '
                  /^([[:space:]]*)image:/ {
                    indent=substr($0,1,match($0,/image:/)-1)
                    line=$0
                    sub(/^[[:space:]]*image:[[:space:]]*/,"",line)
                    gsub(/[ \t\r\n]+$/,"",line)

                    split(line,a,":")
                    name=a[1]

                    if (index(name,"/")>0) {
                      split(name,parts,"/")
                      name=parts[length(parts)]
                    }

                    if (name == "usersapi" || name == "payments-api" || name == "notifications-api" || name == "catalog-api") {
                      print indent "image: " acr "/" name ":" tag
                    } else {
                      print $0
                    }
                    next
                  }
                  { print $0 }
                ' "$COMPOSE" > "$tmpfile" && mv "$tmpfile" "$COMPOSE"

                echo "==== COMPOSE FINAL ===="
                nl -ba "$COMPOSE" | sed -n '1,220p'

                mkdir -p k8s-manifests
                kompose -f "$COMPOSE" convert -o k8s-manifests

                  kubectl apply -n $(kubernetesNamespace) -f k8s-manifests

                # aplica manifests k8s específicos por repositório (se existirem)
                for repo in users-api notifications-api catalog-api payments-api; do
                  REPO_K8S="$(Build.SourcesDirectory)/s/$repo/k8s"
                  if [ -d "$REPO_K8S" ]; then
                    kubectl apply -n $(kubernetesNamespace) -f "$REPO_K8S" || true
                  fi
                done

                kubectl rollout status -n $(kubernetesNamespace) deployment --timeout=10m || true

          - task: AzureCLI@2
            displayName: 'Instalar/atualizar NGINX Ingress Controller'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
            
                kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
                kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=10m

          - task: AzureCLI@2
            displayName: 'Aplicar Services e Ingress versionados'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
            
                kubectl apply -f "$(Build.SourcesDirectory)/k8s/users/service.yaml"
                kubectl apply -f "$(Build.SourcesDirectory)/k8s/catalog/service.yaml"
                kubectl apply -f "$(Build.SourcesDirectory)/k8s/payments/service.yaml"
                kubectl apply -f "$(Build.SourcesDirectory)/k8s/notifications/service.yaml"

                kubectl delete ingress paifgames-ingress -n $(kubernetesNamespace) --ignore-not-found=true
            
                kubectl apply -f "$(Build.SourcesDirectory)/k8s/ingress/users-ingress.yaml"
                kubectl apply -f "$(Build.SourcesDirectory)/k8s/ingress/catalog-ingress.yaml"
                kubectl apply -f "$(Build.SourcesDirectory)/k8s/ingress/payments-ingress.yaml"
                kubectl apply -f "$(Build.SourcesDirectory)/k8s/ingress/notifications-ingress.yaml"
            
                kubectl get svc -n $(kubernetesNamespace)
                kubectl get ingress -n $(kubernetesNamespace)
                kubectl get svc -n ingress-nginx

          - task: AzureCLI@2
            displayName: 'Verificações finais'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                kubectl get pods,svc -n $(kubernetesNamespace) -o wide
                echo "Logs SQL Server (se existir):"
                kubectl logs -n $(kubernetesNamespace) -l app=sqlserver --tail=50 || true
                echo "Logs RabbitMQ (se existir):"
                kubectl logs -n $(kubernetesNamespace) -l app=rabbitmq --tail=50 || true

  - stage: CleanupOnFailure
    displayName: 'Cleanup (apenas em falha)'
    condition: failed()
    jobs:
      - job: Cleanup
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Pipeline falhou. Para remover o AKS execute:"
              echo "az aks delete --resource-group $(vmResourceGroup) --name $(aksClusterName) --yes --no-wait"
            displayName: 'Instruções de cleanup'
