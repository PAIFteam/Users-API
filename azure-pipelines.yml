trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: platforminfra
      type: github
      name: PAIFteam/Platform-INFRA
      endpoint: PAIFteam
    - repository: usersapi
      type: github
      name: PAIFteam/Users-API
      endpoint: PAIFteam
    - repository: notificationsapi
      type: github
      name: PAIFteam/Notifications-API
      endpoint: PAIFteam
    - repository: catalogapi
      type: github
      name: PAIFteam/Catalog-API
      endpoint: PAIFteam
    - repository: paymentsapi
      type: github
      name: PAIFteam/Payments-API
      endpoint: PAIFteam

variables:
  azureSubscription: 'k8spaifgames'    # Service connection do Azure DevOps
  acrServiceConnection: 'dockerpaifgames'   # Service connection ACR (usado pelo Docker task)
  acrName: 'acrpaifgames'                                 # nome do ACR (sem .azurecr.io)
  acrLoginServer: 'acrpaifgames.azurecr.io'               # ex: youracr.azurecr.io
  resourceGroup: 'rg-paifgames'
  location: 'eastus'
  vmResourceGroup: 'vmpaifgames'        # <--- resource group onde o VM/infra já existe
  aksClusterName: 'k8spaifgames'
  kubernetesNamespace: 'paifgames-ns'
  dotnetVersion: '8.0.x'
  imageTag: '$(Build.BuildId)'

stages:
  - stage: BuildAndPush
    displayName: 'Build solutions e push de imagens para ACR'
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: usersapi
            path: 's/users-api'
          - checkout: notificationsapi
            path: 's/notifications-api'
          - checkout: catalogapi
            path: 's/catalog-api'
          - checkout: paymentsapi
            path: 's/payments-api'
          - checkout: platforminfra
            path: 's/platform-infra'
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK'
            inputs:
              packageType: 'sdk'
              version: $(dotnetVersion)
          - task: Docker@2
            displayName: 'Login into Registry $(acrServiceConnection)' 
            inputs:
              containerRegistry: $(acrServiceConnection) 
              command: 'login'
          
          # Ajuste os caminhos dos Dockerfiles conforme a estrutura real de cada repositório.
          - task: Docker@2
            displayName: 'Build & Push Users API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'usersapi'
              command: 'buildAndPush'
              dockerfile: 'users-api/src/Dockerfile'
              buildContext: 'users-api'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Build & Push Notifications API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'notifications-api'
              command: 'buildAndPush'
              dockerfile: 'notifications-api/src/Dockerfile'
              buildContext: 'notifications-api'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Build & Push Catalog API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'catalog-api'
              command: 'buildAndPush'
              dockerfile: 'catalog-api/src/Dockerfile'
              buildContext: 'catalog-api'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Build & Push Payments API'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'payments-api'
              command: 'buildAndPush'
              dockerfile: 'payments-api/src/Dockerfile'
              buildContext: 'payments-api'
              tags: |
                $(imageTag)
                latest

  - stage: CreateAKS
    displayName: 'Criar AKS (k8spaifgames) em vmpaifgames'
    dependsOn: BuildAndPush
    jobs:
    - job: Create
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: AzureCLI@2
          displayName: 'Criar/Configurar AKS no resource group existente (vmpaifgames)'
          inputs:
            azureSubscription: $(azureSubscription)
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              set -e
              RG="$(vmResourceGroup)"
              CLUSTER="$(aksClusterName)"
              ACR="$(acrName)"

              echo "Usando resource group existente: $RG"
              # cria cluster apenas se não existir
              if ! az aks show -g "$RG" -n "$CLUSTER" >/dev/null 2>&1; then
                echo "Criando AKS $CLUSTER no RG $RG"
                az aks create \
                  --resource-group "$RG" \
                  --name "$CLUSTER" \
                  --node-count 1 \
                  --node-vm-size Standard_DC2s_v3 \
                  --generate-ssh-keys \
                  --enable-managed-identity \
                  --attach-acr "$ACR"
              else
                echo "AKS $CLUSTER já existe em $RG"
              fi

              echo "Obtendo credenciais do cluster"
              az aks get-credentials --resource-group "$RG" --name "$CLUSTER" --overwrite-existing
              kubectl get nodes --no-headers

  - stage: Deploy
    displayName: 'Deploy das imagens (A partir do ACR) e docker-compose -> k8s'
    dependsOn: CreateAKS
    jobs:
      - job: DeployToAKS
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: platforminfra
            path: 's/platform-infra'

          - task: AzureCLI@2
            displayName: 'Login ACR e preparar cluster'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                RG="$(vmResourceGroup)"
                CLUSTER="$(aksClusterName)"
                ACR_NAME="$(acrName)"
                ACR_LOGIN="$(acrLoginServer)"
                NAMESPACE="$(kubernetesNamespace)"

                az aks get-credentials -g "$RG" -n "$CLUSTER" --overwrite-existing

                # login no ACR (necessário para pull das imagens)
                az acr login -n "$ACR_NAME"

                kubectl create namespace "$NAMESPACE" || true
                kubectl config set-context --current --namespace="$NAMESPACE"

          - task: AzureCLI@2
            displayName: 'Converter docker-compose (Platform-INFRA) para manifests e aplicar'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                COMPOSE_PATH="$(Build.SourcesDirectory)/platform-infra/docker-compose.yml"
                ACR="$(acrLoginServer)"
                TAG="$(imageTag)"
                NAMESPACE="$(kubernetesNamespace)"

                if [ ! -f "$COMPOSE_PATH" ]; then
                  echo "docker-compose.yml não encontrado: $COMPOSE_PATH"
                  exit 1
                fi

                # garante kompose
                if ! command -v kompose >/dev/null 2>&1; then
                  curl -L https://github.com/kubernetes/kompose/releases/latest/download/kompose-linux-amd64 -o kompose
                  chmod +x kompose
                  sudo mv kompose /usr/local/bin/kompose
                fi

                # altera imagens do compose para apontar ao ACR e tag do build
                tmpfile=$(mktemp)
                awk -v acr="$ACR" -v tag="$TAG" '
                  /^([[:space:]]*)image:/ {
                    indent=substr($0,1,match($0,/image:/)-1)
                    sub(/^[[:space:]]*image:[[:space:]]*/,"")
                    svc=$0
                    gsub(/[ \t\r\n]+$/,"")
                    # pega nome final do serviço (remove registry/namespace)
                    split(svc,a,":")
                    name=a[1]
                    n=name
                    if (index(n,"/")>0) {
                      split(n,parts,"/")
                      n=parts[length(parts)]
                    }
                    print indent "image: " acr "/" n ":" tag
                    next
                  }
                  { print $0 }
                ' "$COMPOSE_PATH" > "$tmpfile" && mv "$tmpfile" "$COMPOSE_PATH"

                mkdir -p k8s-manifests
                kompose -f "$COMPOSE_PATH" convert -o k8s-manifests || kompose convert -f "$COMPOSE_PATH" -o k8s-manifests

                kubectl apply -n "$NAMESPACE" -f k8s-manifests

                # aplica manifests k8s específicos por repositório se existirem (usar paths relativos do checkout do Build)
                for repo in users-api notifications-api catalog-api payments-api; do
                  REPO_PATH="$(Build.SourcesDirectory)/s/${repo}"
                  if [ -d "$REPO_PATH/k8s" ]; then
                    kubectl apply -n "$NAMESPACE" -f "$REPO_PATH/k8s" || true
                  fi
                done

                kubectl rollout status -n "$NAMESPACE" deployment --timeout=10m || true

          - task: AzureCLI@2
            displayName: 'Verificações finais e status'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                NAMESPACE="$(kubernetesNamespace)"
                kubectl get pods,svc -n "$NAMESPACE" -o wide